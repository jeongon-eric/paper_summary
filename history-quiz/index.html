<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#080a14">
<title>역사 한 입 · 한국사·세계사·교양 퀴즈</title>
<style>
:root{
  --bg:#07080f;
  --panel:#0e1122;
  --card:rgba(255,255,255,.055);
  --card2:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --txt:#eef1ff;
  --dim:#98a1c0;
  --dim2:#6c7595;
  --gold:#ffce5c;
  --gold2:#ff9d4d;
  --kr:#ff8080;
  --wh:#5cc8ff;
  --gk:#b78dff;
  --ok:#3fe0a2;
  --no:#ff6b81;
  --radius:22px;
  --tab-h:74px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:#05060c}
body{
  background:#05060c;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
  letter-spacing:-.01em;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}

#app{
  position:relative;
  max-width:480px;
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% -10%, #1a2044 0%, rgba(26,32,68,0) 60%),
    radial-gradient(90% 50% at 110% 30%, rgba(120,60,200,.18) 0%, rgba(120,60,200,0) 60%),
    radial-gradient(80% 45% at -10% 70%, rgba(255,120,60,.10) 0%, rgba(255,120,60,0) 60%),
    linear-gradient(180deg,#0c1024 0%,#080a16 45%,#06070f 100%);
  background-attachment:local;
  overflow:hidden;
  isolation:isolate;
}
#app::before{
  content:"";
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.085) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 55%);
  pointer-events:none;z-index:0;
}
#app::after{
  content:"";
  position:absolute;left:50%;top:-120px;width:420px;height:420px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(255,206,92,.16),transparent 65%);
  filter:blur(20px);pointer-events:none;z-index:0;
  animation:halo 9s ease-in-out infinite alternate;
}
@keyframes halo{from{opacity:.55;transform:translateX(-50%) scale(.95)}to{opacity:.95;transform:translateX(-50%) scale(1.08)}}

/* ---------- screens ---------- */
.screen{
  position:relative;z-index:1;
  display:none;flex:1;
  padding:0 18px calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));
}
.screen.active{display:block;animation:screenIn .34s cubic-bezier(.2,.85,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- hero / home ---------- */
.hero{padding:calc(18px + env(safe-area-inset-top)) 0 0}
.hero-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.02em}
.logo .dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:linear-gradient(150deg,var(--gold),var(--gold2));color:#231a05;box-shadow:0 4px 14px rgba(255,170,60,.35)}
.hello{color:var(--dim);font-size:13.5px;font-weight:600;margin-bottom:8px}
.hero-title{font-size:30px;line-height:1.24;font-weight:800;letter-spacing:-.035em}
.hero-title em{font-style:normal;background:linear-gradient(100deg,var(--gold) 10%,#ffb35c 55%,#ff7a8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.title-badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:7px 13px;border-radius:99px;
  font-size:12px;font-weight:700;color:var(--gold);background:rgba(255,206,92,.10);border:1px solid rgba(255,206,92,.28)}
.title-badge.empty{color:var(--dim);background:rgba(255,255,255,.05);border-color:var(--line)}

.streak{
  display:flex;align-items:center;gap:12px;margin-top:18px;padding:13px 16px;border-radius:16px;
  background:linear-gradient(100deg rgba(255,120,80,.14),rgba(255,120,80,.03));
  background:linear-gradient(100deg,rgba(255,120,80,.16),rgba(255,120,80,.03));
  border:1px solid rgba(255,140,90,.22);
}
.streak .flame{font-size:20px;filter:drop-shadow(0 0 8px rgba(255,120,60,.7))}
.streak .txt{font-size:13px;color:#ffd9c9}
.streak .txt b{color:#ffb08a;font-size:15px}
.streak .best{margin-left:auto;font-size:11.5px;color:var(--dim);font-weight:600}

.section-label{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 11px}
.section-label h2{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.section-label .hint{font-size:11.5px;color:var(--dim2);font-weight:600}

/* daily card */
.daily{position:relative;overflow:hidden;border-radius:26px;padding:20px;
  background:linear-gradient(140deg,#3a2a12 0%,#241a20 45%,#171527 100%);
  border:1px solid rgba(255,206,92,.30);box-shadow:0 18px 40px -22px rgba(255,170,60,.65)}
.daily::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,206,92,.35),transparent 70%);filter:blur(6px)}
.daily .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;
  color:#ffdf9a;background:rgba(255,206,92,.14);border:1px solid rgba(255,206,92,.3);padding:5px 10px;border-radius:8px}
.daily h3{font-size:22px;font-weight:800;margin:13px 0 6px;letter-spacing:-.03em}
.daily p{font-size:13px;color:#d8cdb8;line-height:1.5}
.daily .foot{display:flex;align-items:center;gap:10px;margin-top:16px}
.daily .done{font-size:12px;font-weight:700;color:var(--ok)}
.btn-primary{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#ffd979,#ffab4d);color:#241a05;
  box-shadow:0 10px 24px -10px rgba(255,180,70,.85);
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn-primary:active{transform:scale(.975);box-shadow:0 6px 16px -10px rgba(255,180,70,.8)}
.btn-ghost{
  min-height:52px;padding:0 18px;border-radius:16px;font-size:14px;font-weight:700;color:var(--txt);
  background:rgba(255,255,255,.07);border:1px solid var(--line);
}

/* category grid */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{
  position:relative;text-align:left;padding:15px 12px 14px;border-radius:20px;overflow:hidden;
  background:var(--card);border:1px solid var(--line);
  transition:transform .15s ease,border-color .2s;
}
.cat:active{transform:scale(.97)}
.cat .ico{font-size:24px;display:block;margin-bottom:26px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.cat .nm{font-size:14px;font-weight:800;display:block}
.cat .bs{display:block;font-size:11px;color:var(--dim);margin-top:3px;font-weight:600}
.cat .ring{position:absolute;right:10px;top:10px;font-size:10px;font-weight:800;color:var(--dim2)}
.cat.k{border-color:rgba(255,128,128,.26);background:linear-gradient(160deg,rgba(255,128,128,.16),rgba(255,128,128,.03) 70%)}
.cat.w{border-color:rgba(92,200,255,.26);background:linear-gradient(160deg,rgba(92,200,255,.16),rgba(92,200,255,.03) 70%)}
.cat.g{border-color:rgba(183,141,255,.26);background:linear-gradient(160deg,rgba(183,141,255,.16),rgba(183,141,255,.03) 70%)}
.cat.k .ico{filter:drop-shadow(0 0 14px rgba(255,128,128,.45))}
.cat.w .ico{filter:drop-shadow(0 0 14px rgba(92,200,255,.45))}
.cat.g .ico{filter:drop-shadow(0 0 14px rgba(183,141,255,.45))}

/* survival */
.surv{margin-top:10px;display:flex;align-items:center;gap:14px;padding:17px 18px;border-radius:22px;
  background:linear-gradient(120deg,rgba(255,107,129,.16),rgba(255,107,129,.03) 60%),var(--card2);
  border:1px solid rgba(255,107,129,.26)}
.surv .ico{font-size:26px}
.surv .t{flex:1}
.surv .t b{display:block;font-size:15.5px;font-weight:800}
.surv .t span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
.surv .hearts{font-size:13px;letter-spacing:1px}
.surv .go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;
  background:rgba(255,107,129,.18);border:1px solid rgba(255,107,129,.35);color:#ffc2cb}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stat{padding:14px 12px;border-radius:18px;background:var(--card2);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.stat span{display:block;font-size:11px;color:var(--dim);margin-top:3px;font-weight:600}

/* ---------- quiz ---------- */
#screen-quiz{padding:0 16px calc(14px + env(safe-area-inset-bottom));display:none;flex-direction:column}
#screen-quiz.active{display:flex}
#screen-result{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.quiz-head{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 2px 10px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:15px;
  color:var(--dim);background:rgba(255,255,255,.055);border:1px solid var(--line);flex:0 0 auto}
.icon-btn:active{transform:scale(.94)}
.progress-track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.085);overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd979,#ff9d5c);
  transition:width .35s cubic-bezier(.2,.8,.3,1)}
.hud-score{font-size:14px;font-weight:800;color:var(--gold);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.quiz-sub{display:flex;align-items:center;gap:8px;padding:0 2px 10px;min-height:28px}
.chip{font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#cfd6ef;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.k{color:#ffb3b3;background:rgba(255,128,128,.12);border-color:rgba(255,128,128,.3)}
.chip.w{color:#a9e2ff;background:rgba(92,200,255,.12);border-color:rgba(92,200,255,.3)}
.chip.g{color:#d5c2ff;background:rgba(183,141,255,.12);border-color:rgba(183,141,255,.3)}
.hearts{margin-left:auto;font-size:14px;letter-spacing:2px;color:#ff8a9b;filter:drop-shadow(0 0 6px rgba(255,90,120,.5))}
.hearts .off{opacity:.22;filter:none}
.combo-badge{margin-left:auto;font-size:12px;font-weight:800;color:#ffc06a;padding:5px 10px;border-radius:9px;
  background:rgba(255,170,80,.13);border:1px solid rgba(255,170,80,.28);opacity:0;transform:scale(.8);transition:.2s}
.combo-badge.on{opacity:1;transform:none}
.combo-badge.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.timer-track{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 2px 0;opacity:0;transition:opacity .2s}
.timer-track.on{opacity:1}
.timer-fill{height:100%;width:100%;border-radius:99px;background:var(--ok)}
.timer-fill.warn{background:#ffbb55}
.timer-fill.danger{background:var(--no)}

.q-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:20px;overflow-y:auto;scrollbar-width:none}
.q-wrap::-webkit-scrollbar{display:none}
.q-index{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--dim2);margin-bottom:10px}
.q-text{font-size:22.5px;line-height:1.42;font-weight:800;letter-spacing:-.035em;margin-bottom:22px;word-break:keep-all}
.q-hint{font-size:12px;color:var(--dim2);margin:-14px 0 18px;font-weight:600}
.choices{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.choice{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:16px 15px;border-radius:18px;font-size:15.5px;line-height:1.42;font-weight:600;
  color:var(--txt);background:rgba(255,255,255,.045);border:1px solid var(--line);
  transition:transform .13s ease,background .18s,border-color .18s,opacity .2s;
  word-break:keep-all;
}
.choice:active{transform:scale(.982);background:rgba(255,255,255,.08)}
.choice .key{
  flex:0 0 26px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--dim);background:rgba(255,255,255,.08);margin-top:-1px;
  transition:.18s;
}
.choice.correct{background:rgba(63,224,162,.15);border-color:rgba(63,224,162,.65);color:#d6fff0}
.choice.correct .key{background:rgba(63,224,162,.9);color:#04281c}
.choice.wrong{background:rgba(255,107,129,.14);border-color:rgba(255,107,129,.65);color:#ffdfe4}
.choice.wrong .key{background:rgba(255,107,129,.9);color:#2b0510}
.choice.dim{opacity:.42}
.ox-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding-bottom:12px}
.ox{
  height:148px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:58px;font-weight:800;line-height:1;background:rgba(255,255,255,.045);border:1.5px solid var(--line);
  transition:transform .13s ease,background .2s,border-color .2s,opacity .2s;
}
.ox:active{transform:scale(.965)}
.ox small{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--dim2);margin-top:6px}
.ox[data-v="O"]{color:var(--wh);background:radial-gradient(circle at 50% 35%,rgba(92,200,255,.17),rgba(92,200,255,.035));border-color:rgba(92,200,255,.32)}
.ox[data-v="X"]{color:#ff8d9d;background:radial-gradient(circle at 50% 35%,rgba(255,107,129,.17),rgba(255,107,129,.035));border-color:rgba(255,107,129,.32)}
.ox.correct{background:rgba(63,224,162,.2);border-color:rgba(63,224,162,.75);color:#8effcd;box-shadow:0 0 30px -8px rgba(63,224,162,.55)}
.ox.wrong{background:rgba(255,107,129,.2);border-color:rgba(255,107,129,.75)}
.ox.dim{opacity:.35}

.float-score{
  position:fixed;left:50%;top:34%;transform:translate(-50%,0);z-index:60;pointer-events:none;
  font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 4px 18px rgba(255,170,60,.55);
  animation:floatUp 1s ease-out forwards;
}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}25%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}

/* ---------- feedback sheet ---------- */
.sheet{
  position:fixed;left:50%;bottom:0;z-index:70;width:100%;max-width:480px;
  transform:translate(-50%,105%);
  background:linear-gradient(180deg,#1a1e36 0%,#111426 55%,#0c0f1e 100%);
  border-radius:28px 28px 0 0;border:1px solid var(--line2);border-bottom:0;
  padding:10px 18px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -24px 60px -12px rgba(0,0,0,.8);
  transition:transform .38s cubic-bezier(.2,.9,.25,1);
  max-height:74dvh;display:flex;flex-direction:column;
}
.sheet.show{transform:translate(-50%,0)}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);margin:4px auto 14px;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex:0 0 auto}
.res-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.res-ico.ok{background:rgba(63,224,162,.16);color:var(--ok);border:1px solid rgba(63,224,162,.4)}
.res-ico.no{background:rgba(255,107,129,.16);color:var(--no);border:1px solid rgba(255,107,129,.4)}
.sheet-head .tt{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sheet-head .tt small{display:block;font-size:11.5px;font-weight:600;color:var(--dim);margin-top:2px}
.sheet-head .pts{margin-left:auto;font-size:16px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;padding-right:2px}
.sheet-body::-webkit-scrollbar{width:0}
.ex-label{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--gold);
  padding:4px 8px;border-radius:7px;background:rgba(255,206,92,.1);border:1px solid rgba(255,206,92,.22);margin-bottom:9px}
.ex-text{font-size:14.5px;line-height:1.62;color:#d9def2;word-break:keep-all;margin-bottom:14px}
.ex-answer{font-size:12.5px;color:var(--dim);margin-bottom:10px;font-weight:600}
.ex-answer b{color:#d7e3ff}
.btn-next{
  width:100%;min-height:54px;border-radius:16px;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,#ffd979,#ffab4d);color:#241a05;flex:0 0 auto;margin-top:6px;
  box-shadow:0 10px 24px -12px rgba(255,180,70,.9);
}
.btn-next:active{transform:scale(.985)}
.btn-next.dark{background:rgba(255,255,255,.1);color:var(--txt);box-shadow:none;border:1px solid var(--line2)}

/* ---------- result ---------- */
.res-wrap{padding:calc(26px + env(safe-area-inset-top)) 0 0;text-align:center}
.res-kicker{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--dim2)}
.res-score{font-size:64px;font-weight:900;letter-spacing:-.05em;line-height:1.05;margin:8px 0 2px;
  background:linear-gradient(120deg,#fff2c9,#ffce5c 45%,#ff9d5c);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums}
.res-score small{font-size:18px;letter-spacing:0;margin-left:4px;-webkit-text-fill-color:var(--dim);color:var(--dim)}
.res-mode{font-size:13.5px;color:var(--dim);font-weight:600}
.record{display:inline-flex;align-items:center;gap:6px;margin:14px 3px 0;padding:7px 14px;border-radius:99px;
  font-size:12px;font-weight:800;color:#1d1503;background:linear-gradient(120deg,#ffe08a,#ffb35c);
  box-shadow:0 8px 22px -10px rgba(255,180,80,.9);animation:recordIn .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes recordIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:24px 0 6px}
.res-cell{padding:14px 8px;border-radius:17px;background:var(--card2);border:1px solid var(--line)}
.res-cell b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.res-cell span{display:block;font-size:10.5px;color:var(--dim);margin-top:4px;font-weight:700}
.res-cell b.ok{color:var(--ok)}
.res-cell b.no{color:var(--no)}
.unlocked{margin-top:18px;text-align:left;padding:15px 16px;border-radius:18px;
  background:linear-gradient(130deg,rgba(255,206,92,.13),rgba(255,206,92,.03));border:1px solid rgba(255,206,92,.28)}
.unlocked .h{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold);margin-bottom:8px}
.unlocked .a{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:4px 0}
.unlocked .a .i{font-size:16px}
.res-actions{display:flex;gap:10px;margin-top:22px}
.res-actions .btn-primary{flex:1.4}
.res-actions .btn-ghost{flex:1}
.res-note{margin-top:16px;font-size:12px;color:var(--dim2);line-height:1.5;min-height:18px}

/* ---------- collection ---------- */
.page-head{padding:calc(20px + env(safe-area-inset-top)) 0 4px}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.04em}
.page-head p{font-size:12.5px;color:var(--dim);margin-top:6px}
.seg{display:flex;gap:4px;margin:18px 0 16px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{flex:1;padding:10px 4px;border-radius:11px;font-size:12.5px;font-weight:800;color:var(--dim);transition:.18s}

.empty span{font-size:12.5px;line-height:1.6;display:block}

.wrong-item{padding:15px 16px;border-radius:18px;background:var(--card2);border:1px solid var(--line);margin-bottom:10px}
.wrong-item .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.wrong-item .cat{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--dim)}
.wrong-item .cat.k{color:#ffb3b3;background:rgba(255,128,128,.13)}
.wrong-item .cat.w{color:#a9e2ff;background:rgba(92,200,255,.13)}
.wrong-item .cat.g{color:#d5c2ff;background:rgba(183,141,255,.13)}
.wrong-item .cnt{margin-left:auto;font-size:10.5px;color:var(--dim2);font-weight:700}
.wrong-item .q{font-size:14.5px;font-weight:700;line-height:1.45;margin-bottom:10px;word-break:keep-all}
.wrong-item .ans{font-size:12px;line-height:1.6;color:var(--dim)}
.wrong-item .ans b{color:var(--ok);font-weight:700}
.wrong-item .ans s{color:var(--no);text-decoration:none}
.wrong-item .ex{font-size:12.5px;line-height:1.62;color:#b9c2dd;margin-top:7px;padding-top:9px;border-top:1px dashed rgba(255,255,255,.09)}
.wrong-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wrong-head .n{font-size:12.5px;color:var(--dim);font-weight:700}
.wrong-head .btn-ghost{margin-left:auto;min-height:38px;height:38px;padding:0 13px;border-radius:11px;font-size:12px}

.title-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.title-card{padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);text-align:left;transition:.16s}
.title-card:active{transform:scale(.98)}
.title-card .i{font-size:19px}
.title-card b{display:block;font-size:13px;font-weight:800;margin-top:8px}
.title-card span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.title-card.on{border-color:rgba(255,206,92,.55);background:linear-gradient(150deg,rgba(255,206,92,.15),rgba(255,206,92,.03))}
.title-card.locked{opacity:.42}
.title-card .use{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;color:var(--gold)}
.title-card.locked .use{color:var(--dim2)}

.ach{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.ach .i{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.06);filter:grayscale(1);opacity:.45}
.ach.on .i{filter:none;opacity:1;background:linear-gradient(140deg,rgba(255,206,92,.22),rgba(255,206,92,.06));border:1px solid rgba(255,206,92,.3)}
.ach .b b{display:block;font-size:13.5px;font-weight:800}
.ach .b span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.ach .ck{margin-left:auto;font-size:13px;color:var(--ok);font-weight:800}
.ach.locked .b b{color:#aab2cc}

.stat-line{margin-bottom:14px}
.stat-line .r{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px}
.stat-line .r span{color:var(--dim)}
.stat-line .track{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.stat-line .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#ff9d5c);transition:width .6s}
.stat-line.k .fill{background:linear-gradient(90deg,#ff8f8f,#ff5f7a)}
.stat-line.w .fill{background:linear-gradient(90deg,#6fd1ff,#3d8bff)}
.stat-line.g .fill{background:linear-gradient(90deg,#c9a6ff,#8b5cff)}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:22px}
.stat-cards .sc{padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.stat-cards .sc b{display:block;font-size:20px;font-weight:800}
.stat-cards .sc span{display:block;font-size:11px;color:var(--dim);margin-top:3px;font-weight:600}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.set-row .t{flex:1}
.set-row .t b{display:block;font-size:14.5px;font-weight:700}
.set-row .t span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(120deg,#ffd979,#ffab4d)}
.sw.on::after{left:23px}
.danger{width:100%;margin-top:22px;min-height:50px;border-radius:15px;font-size:13.5px;font-weight:800;color:#ff9aa8;
  background:rgba(255,107,129,.09);border:1px solid rgba(255,107,129,.3)}
.about{margin-top:26px;padding:16px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.7}
.about b{color:#cdd5ee}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;
  width:100%;max-width:480px;display:flex;gap:4px;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
  background:rgba(9,11,22,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.08);
}
.tabbar.hide{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:14px;
  color:var(--dim2);font-size:10.5px;font-weight:700;transition:.16s}
.tab .ti{font-size:17px;line-height:1;filter:grayscale(.6);opacity:.75}
.tab.on{color:var(--gold);background:rgba(255,206,92,.07)}
.tab.on .ti{filter:none;opacity:1}

/* ---------- toast / modal ---------- */
.toast{
  position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:90;
  max-width:420px;width:calc(100% - 40px);
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;
  background:linear-gradient(120deg,#2a2410,#1a1a2b);border:1px solid rgba(255,206,92,.4);
  box-shadow:0 16px 40px -14px rgba(0,0,0,.9);transition:transform .4s cubic-bezier(.2,.9,.25,1);
  font-size:12.5px;font-weight:700;
}
.toast.show{transform:translate(-50%,0)}
.toast .ti{font-size:18px}
.toast b{display:block;font-size:12.5px;color:var(--gold)}
.toast span{display:block;font-size:11px;color:var(--dim);margin-top:1px;font-weight:600}

.modal-bg{position:fixed;inset:0;background:rgba(4,5,10,.72);backdrop-filter:blur(4px);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:330px;border-radius:24px;padding:22px 20px;background:linear-gradient(160deg,#1b2038,#121526);
  border:1px solid var(--line2);box-shadow:0 30px 80px -20px #000;transform:scale(.94);transition:transform .22s}
.modal-bg.show .modal{transform:none}
.modal h3{font-size:17px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.modal p{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:18px}
.modal .row{display:flex;gap:8px}
.modal .row button{flex:1;min-height:46px;border-radius:13px;font-size:14px;font-weight:800}
.modal .row .cancel{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--dim)}
.modal .row .ok{background:linear-gradient(120deg,#ffd979,#ffab4d);color:#241a05}
.modal .row .ok.red{background:linear-gradient(120deg,#ff8a9b,#ff5f7a);color:#2b0510}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.confetti i{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(105vh) rotate(680deg);opacity:.2}}

.hidden{display:none !important}
@media (max-height:680px){
  .hero-title{font-size:26px}
  .q-text{font-size:20px}
  .ox{height:118px;font-size:48px}
  .res-score{font-size:54px}
}
</style>

<script>
/* =========================================================
   문제 은행 — 한국사 24 · 세계사 24 · 교양 상식 24 (총 72문)
   ========================================================= */
const CATS = {
  korean:  { name:'한국사',   icon:'🏯', cls:'k', desc:'삼국시대부터 근현대까지' },
  world:   { name:'세계사',   icon:'🌍', cls:'w', desc:'고대 문명부터 냉전까지' },
  general: { name:'교양 상식', icon:'💡', cls:'g', desc:'과학·예술·철학·지리' }
};

const QUESTIONS = [
  /* ---------------- 한국사 ---------------- */
  {id:'k01',cat:'korean',tag:'삼국시대',type:'mc',
   q:'고구려 광개토대왕의 업적을 기리려고 아들 장수왕이 세운 비석은?',
   choices:['광개토대왕릉비','충주 고구려비','북한산 순수비','살수대첩비'],answer:0,
   ex:'장수왕은 414년 아버지의 정복 활동을 남기려고 지금의 중국 지린성 지안에 거대한 비석을 세웠어요. 1,800여 자가 새겨진 이 비는 삼국 시대사를 복원하는 일급 사료로 꼽힙니다.'},

  {id:'k02',cat:'korean',tag:'삼국시대',type:'ox',
   q:'삼국 가운데 불교를 가장 먼저 공인한 나라는 신라이다.',
   choices:['O','X'],answer:1,
   ex:'가장 먼저 불교를 받아들인 나라는 고구려예요. 372년 소수림왕 때 전진의 승려 순도를 통해 공인했고, 백제는 384년, 신라는 한참 뒤인 527년 법흥왕 때 공인이 이루어졌습니다.'},

  {id:'k03',cat:'korean',tag:'삼국시대',type:'mc',
   q:'신라의 귀족 회의인 화백회의에서 결정을 내리는 방식은?',
   choices:['만장일치','다수결','왕의 최종 결정','제비뽑기'],answer:0,
   ex:'화백회의는 성골·진골 귀족들이 모여 나라의 큰일을 논의하던 회의체로, 한 사람이라도 반대하면 결정하지 않는 만장일치 원칙을 지켰어요. 그래서 신라 정치를 "귀족들의 합의 정치"라고 부릅니다.'},

  {id:'k04',cat:'korean',tag:'고려',type:'mc',
   q:'고려 시대 음력 11월에 열린, 토속 신앙과 불교가 어우러진 국가 제사 의례는?',
   choices:['팔관회','연등회','동맹','제천행사'],answer:0,
   ex:'팔관회는 하늘과 땅, 산천의 신에게 제사 지내며 나라의 평안을 빌던 고려의 대표 행사예요. 부처님 오신 날인 음력 2월의 연등회와 함께 고려의 양대 국가 행사로 꼽혔습니다.'},

  {id:'k05',cat:'korean',tag:'조선',type:'mc',
   q:'세종대왕이 훈민정음을 세상에 반포한 해는?',
   choices:['1443년','1446년','1392년','1490년'],answer:1,
   ex:'훈민정음은 1443년에 만들어졌고, 해설을 붙인 《훈민정음 해례본》이 1446년에 반포됐어요. 이 해례본은 1997년 유네스코 세계기록유산으로 등재됐습니다.'},

  {id:'k06',cat:'korean',tag:'고려말·조선초',type:'mc',
   q:'1388년 이성계가 요동 정벌 명령을 뒤집고 군사를 개경으로 돌린 사건은?',
   choices:['위화도 회군','홍건적의 난','무신정변','쌍성총관부 수복'],answer:0,
   ex:'이성계는 압록강 위화도에서 군사를 돌려 최영을 제거하고 권력을 잡았어요. 이 회군이 4년 뒤 조선 건국의 발판이 됐습니다.'},

  {id:'k07',cat:'korean',tag:'조선',type:'mc',
   q:'이순신이 한산도 앞바다에서 학의 날개 모양 진형으로 왜군을 무찌른 해전은?',
   choices:['한산도 대첩','명량 대첩','노량 해전','옥포 해전'],answer:0,
   ex:'1592년 7월 한산도 대첩에서 이순신은 학익진을 펼쳐 왜군 함선 60여 척을 격파했어요. 행주 대첩, 진주 대첩과 함께 임진왜란 3대 대첩으로 불립니다.'},

  {id:'k08',cat:'korean',tag:'조선',type:'mc',
   q:'정조가 아버지 사도세자의 묘를 옮기며 쌓은, 정약용의 거중기가 동원된 성곽은?',
   choices:['수원 화성','남한산성','북한산성','행주산성'],answer:0,
   ex:'수원 화성은 1794년부터 1796년까지 쌓은 계획 도시형 성곽이에요. 정약용이 고안한 거중기를 써서 무거운 돌을 들어 올렸고, 그 기록이 《화성성역의궤》에 남아 있습니다.'},

  {id:'k09',cat:'korean',tag:'조선 후기',type:'mc',
   q:'《목민심서》를 지어 지방 관리의 올바른 자세를 강조한 실학자는?',
   choices:['정약용','박제가','홍대용','정상기'],answer:0,
   ex:'정약용은 유배지 강진에서 《목민심서》와 《흠흠신서》를 썼어요. 함께 실학자로 꼽히는 박제가는 중국의 앞선 기술을 배우자고 주장한 《북학의》를 남겼습니다.'},

  {id:'k10',cat:'korean',tag:'근대',type:'mc',
   q:'1894년 "보국안민"을 내걸고 고부에서 봉기한 동학농민운동의 지도자는?',
   choices:['전봉준','최제우','홍범도','김좌진'],answer:0,
   ex:'전봉준은 고부 군수 조병갑의 수탈에 맞서 농민들을 이끌었어요. 동학을 창시한 최제우는 1860년대 인물이고, 홍범도와 김좌진은 훗날 독립군을 이끈 인물입니다.'},

  {id:'k11',cat:'korean',tag:'일제강점기',type:'mc',

function pad2(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayKey(){return dateKey(new Date());}
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return dateKey(d);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(arr,rng){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const r=rng?rng():Math.random();
    const j=Math.floor(r*(i+1));
    const t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function seeded(seed){
  let t=seed>>>0;
  return function(){
    t+=0x6D2B79F5;
    let r=Math.imul(t^(t>>>15),1|t);
    r^=r+Math.imul(r^(r>>>7),61|r);
    return ((r^(r>>>14))>>>0)/4294967296;
  };
}
function hashStr(s){
  let h=2166136261;

}

/* ---------- sound ---------- */
let AC=null;
function ac(){
  if(AC) return AC;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    AC=new Ctx();
  }catch(e){ AC=null; }
  return AC;
}
function tone(freq,delay,dur,type,vol){
  const c=ac(); if(!c) return;
  try{
    if(c.state==='suspended') c.resume();
    const t=c.currentTime+delay;
    const o=c.createOscillator();
    const g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function sfx(kind){
  if(!DATA.sound) return;
  if(kind==='ok'){ tone(680,0,.10,'sine',.055); tone(1020,.075,.16,'sine',.05); }

  else if(kind==='combo'){ tone(880,0,.08,'sine',.045); tone(1180,.07,.09,'sine',.04); tone(1480,.14,.12,'sine',.035); }
  else if(kind==='end'){ tone(523,0,.12,'sine',.05); tone(659,.11,.12,'sine',.05); tone(784,.22,.22,'sine',.055); }
  else if(kind==='tap'){ tone(560,0,.035,'sine',.025); }
  else if(kind==='badge'){ tone(1046,0,.09,'sine',.04); tone(1318,.09,.14,'sine',.04); }
}

/* ---------- game ---------- */
function buildRound(mode,cat){
  if(mode==='daily'){
    const rng=seeded(hashStr('hb-daily-'+todayKey()));
    const pick=function(c,n){ return shuffle(QUESTIONS.filter(function(q){return q.cat===c;}),rng).slice(0,n); };
    let list=pick('korean',4).concat(pick('world',3)).concat(pick('general',3));
    return shuffle(list,rng);
  }
  if(mode==='category'){
    return shuffle(QUESTIONS.filter(function(q){return q.cat===cat;})).slice(0,10);
  }
  if(mode==='review'){
    const ids=Object.keys(DATA.wrong).sort(function(a,b){return (DATA.wrong[b].at||0)-(DATA.wrong[a].at||0);}).slice(0,10);
    const qs=ids.map(function(id){ return QUESTIONS.find(function(q){return q.id===id;}); }).filter(Boolean);
    return shuffle(qs);
  }
  return shuffle(QUESTIONS);
}

function start(mode,cat){
  let qs=buildRound(mode,cat);
  if(!qs.length){
    showToast('📝','복습할 문제가 없어요','먼저 라운드를 풀어 오답을 만들어 보세요.');
    if(mode==='review'){ renderHome(); showScreen('home'); }
    return;
  }
  LAST={mode:mode,cat:cat||null};
  G={
    mode:mode, cat:cat||null, queue:qs, idx:0,
    score:0, combo:0, maxCombo:0, hearts:3,
    answered:0, correct:0, locked:false, roundWrong:[],
    limit:(mode==='survival'?15:0), tEnd:0, raf:0, completed:false, reviewFixed:0
  };
  showScreen('quiz');
  hideSheet();
  renderQuestion();
}

  $('timer-track').classList.remove('on');
}
function tickTimer(){
  if(!G||G.locked) return;
  const left=Math.max(0,G.tEnd-performance.now());
  const f=left/(G.limit*1000);
  const pf=$('q-progress');
  pf.style.width=(f*100)+'%';
  pf.style.background = f>0.5 ? 'linear-gradient(90deg,#3fe0a2,#8ef0c0)'
    : f>0.25 ? 'linear-gradient(90deg,#ffcf5c,#ff9d4d)'
    : 'linear-gradient(90deg,#ff6b81,#ff3d5a)';
  if(left<=0){ answer(-1); return; }
  G.raf=requestAnimationFrame(tickTimer);
}

  if(!G) return;
  $('q-hearts').innerHTML=Array.apply(null,Array(3)).map(function(_,i){
    return '<span class="'+(i<G.hearts?'':'off')+'">'+(i<G.hearts?'❤':'♡')+'</span>';
  }).join('');
}

function answer(pick){
  if(!G||G.locked) return;
  G.locked=true;
  if(G.raf){ cancelAnimationFrame(G.raf); G.raf=0; }
  $('timer-track').classList.remove('on');

  const q=G.queue[G.idx];
  const surv=G.mode==='survival';
  const timedOut=(pick===-1);
  const ok=!timedOut&&pick===q.answer;

  G.answered++;
  let gain=0;
  if(ok){
    G.correct++;
    G.combo++;
    if(G.combo>G.maxCombo) G.maxCombo=G.combo;
    const bonus=Math.min(G.combo-1,5)*20;
    let speed=0;
    if(surv){
      const left=Math.max(0,G.tEnd-performance.now());
      speed=Math.round(left/(G.limit*1000)*50);
    }
    gain=100+bonus+speed;
    G.score+=gain;
  }else{
    G.combo=0;
    if(surv) G.hearts--;
  }

  /* --- mark buttons --- */
  const btns=Array.prototype.slice.call(document.querySelectorAll('#q-choices button'));
  btns.forEach(function(b,i){
    b.disabled=true;
    if(i===q.answer) b.classList.add('correct');
    else if(i===pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(!ok&&pick>=0&&btns[pick]) btns[pick].classList.add('wrong');

  /* --- stats --- */
  const d=DATA;
  d.total.answered++;
  if(ok) d.total.correct++;
  const cs=d.catStats[q.cat];
  cs.a++; if(ok) cs.c++;
  d.seen[q.id]=true;
  if(G.maxCombo>d.maxCombo) d.maxCombo=G.maxCombo;
  if(ok){
    if(d.wrong[q.id]) delete d.wrong[q.id];
    if(G.mode==='review'){ d.reviewCorrect=(d.reviewCorrect||0)+1; G.reviewFixed++; }
  }else{
    const prev=d.wrong[q.id];
    d.wrong[q.id]={n:(prev?prev.n:0)+1,pick:pick,at:Date.now()};
    G.roundWrong.push(q.id);
  }
  save();

  /* --- effects --- */
  $('q-score').textContent=G.score;
  updateHearts();
  const cb=$('q-combo');
  cb.classList.toggle('on',G.combo>=2);
  cb.innerHTML='🔥 '+G.combo;
  if(ok){
    if(G.combo>=2){
      cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop');
    }
    floatScore('+'+gain+(G.combo>=3?'  🔥'+G.combo:''));
    sfx(G.combo>=5?'combo':'ok');
    buzz(14);
  }else{
    sfx('no');
    buzz(timedOut?40:30);
  }

  checkAch(true);
  showFeedback(q,pick,ok,timedOut,gain);
}

function floatScore(txt){
  const el=document.createElement('div');
  el.className='float-score';
  el.textContent=txt;
  document.getElementById('app').appendChild(el);
  setTimeout(function(){ el.remove(); },1000);
}

function choiceText(q,i){
  if(i===null||i===undefined||i<0) return '';
  if(q.type==='ox') return q.choices[i];
  return NUM[i]+' '+q.choices[i];
}

function showFeedback(q,pick,ok,timedOut,gain){
  const surv=G.mode==='survival';
  const last=G.idx>=G.queue.length-1;
  const dead=surv&&G.hearts<=0;
  const nextLabel=dead?'결과 보기':(last&&!surv?'결과 보기':'다음 문제');

  let head,answerLine;
  if(ok){
    head='<div class="res-ico ok">✓</div><div class="tt">정답이에요!'+
      (G.combo>=3?'<small>'+G.combo+'연속 · 콤보 보너스!</small>':'<small>좋아요, 감이 오는데요</small>')+
      '</div><div class="pts">+'+gain+'</div>';
    answerLine='';
  }else{
    head='<div class="res-ico no">✕</div><div class="tt">'+(timedOut?'시간 초과!':'아쉬워요')+
      '<small>'+(surv&&G.hearts>0?'하트가 하나 줄었어요':'정답을 확인해 보세요')+'</small>'+
      '</div><div class="pts">+0</div>';
    answerLine='<div class="ex-answer">정답 <b>'+esc(choiceText(q,q.answer))+'</b>'+
      (!timedOut&&pick>=0?' · 내가 고른 답 <s style="color:var(--no)">'+esc(choiceText(q,pick))+'</s>':'')+'</div>';
  }

  $('sheet-body').innerHTML=
    head+
    '<div class="sheet-body">'+
      answerLine+
      '<span class="ex-label">한 입 해설</span>'+
      '<div class="ex-text">'+esc(q.ex)+'</div>'+
    '</div>'+
    '<button class="btn-next" data-act="next">'+nextLabel+'</button>';

  const sheet=$('sheet');
  sheet.classList.add('show');
}

function hideSheet(){ $('sheet').classList.remove('show'); }

function nextQuestion(){
  if(!G||!G.locked) return;
  hideSheet();
  const surv=G.mode==='survival';
  const last=G.idx>=G.queue.length-1;

  if(surv){
    if(G.hearts<=0){ finish(true); return; }
    if(last){ G.queue=G.queue.concat(shuffle(QUESTIONS)); }
    G.idx++;
    renderQuestion();
    return;
  }
  if(last){ finish(true); return; }
  G.idx++;
  renderQuestion();
}

/* ---------- finish ---------- */
function finish(completed){
  if(!G) return;
  stopTimer();
  hideSheet();
  const g=G,d=DATA;
  const mode=g.mode, cat=g.cat;
  const key=bestKey(mode,cat);
  const answered=g.answered, correct=g.correct;
  const acc=answered?Math.round(correct/answered*100):0;
  const prevBest=d.best[key]||0;
  const isRecord=answered>0&&g.score>prevBest;
  g.prevBest=prevBest;

  if(g.score>prevBest) d.best[key]=g.score;

  if(answered>0){
    d.rounds++;
    const t=todayKey();
    if(d.streak.last!==t){
      d.streak.count=(d.streak.last===yesterdayKey())?d.streak.count+1:1;
      d.streak.last=t;
      if(d.streak.count>d.streak.best) d.streak.best=d.streak.count;
    }
  }
  if(answered>=10&&correct===answered){
    d.perfectRounds++;
    if(mode==='category'&&d.catPerfect[cat]!==undefined) d.catPerfect[cat]=true;
  }
  if(mode==='survival'&&answered>d.survBest) d.survBest=answered;
  if(mode==='daily'&&answered>=g.queue.length){
    d.dailyDate=todayKey();
    if(g.score>(d.dailyScore||0)) d.dailyScore=g.score;
  }
  save();

  const newAch=checkAch(false);
  if(!d.title){
    const firstTitle=ACHS.find(function(a){return !!a.title&&d.ach[a.id];});
    if(firstTitle){ d.title=firstTitle.title; save(); }
  }
  g.completed=!!completed;

  const perfect=(answered>=10&&correct===answered);
  renderResult(isRecord,newAch,acc,perfect);
  showScreen('result');
  if(isRecord||perfect) confetti();
  sfx('end');
}

function confetti(){
  const box=$('confetti');
  const colors=['#ffce5c','#ff9d5c','#5cc8ff','#b78dff','#3fe0a2','#ff6b81'];
  let html='';
  for(let i=0;i<46;i++){
    const left=Math.random()*100;
    const delay=Math.random()*0.5;
    const dur=1.6+Math.random()*1.4;
    const size=5+Math.random()*7;
    const col=colors[Math.floor(Math.random()*colors.length)];
    html+='<i style="left:'+left+'%;top:0;width:'+size+'px;height:'+(size*0.6)+'px;background:'+col+
      ';animation-delay:'+delay+'s;animation-duration:'+dur+'s;transform:rotate('+Math.random()*180+'deg)"></i>';
  }
  box.innerHTML=html;
  setTimeout(function(){ box.innerHTML=''; },3200);
}

function renderResult(isRecord,newAch,acc,perfect){
  const g=G,d=DATA;
  const surv=g.mode==='survival';
  const title = !g.completed ? '중단한 라운드' : (surv?'서바이벌 종료':'라운드 완료');
  const sub = modeName(g.mode,g.cat)+' · '+g.answered+'문제';

  const unlockHtml = newAch.length ?
    '<div class="unlocked"><div class="h">NEW 칭호 · 업적</div>'+
      newAch.map(function(a){
        return '<div class="a"><span class="i">'+a.icon+'</span><span>'+esc(a.name)+
          (a.title?' <span style="color:var(--dim);font-weight:600">· '+esc(a.title)+'</span>':'')+'</span></div>';
      }).join('')+
    '</div>' : '';

  const wrongN=g.roundWrong.length;
  let note;
  if(!g.answered) note='다음엔 한 문제라도 풀어봐요!';
  else if(perfect) note='전부 맞혔어요. 이 정도면 오늘의 역사왕!';
  else if(wrongN) note='틀린 '+wrongN+'문제는 도감 > 오답 노트에 저장했어요.';
  else note='좋아요. 다음 라운드도 가볼까요?';

  $('result-body').innerHTML=
    '<div class="res-wrap">'+
      '<div class="res-kicker">'+esc(title).toUpperCase()+'</div>'+
      '<div class="res-score" id="res-score">0<small>점</small></div>'+
      '<div class="res-mode">'+esc(sub)+'</div>'+
      (isRecord?'<div class="record">🏅 '+(g.prevBest>0?'신기록! 이전 최고 '+g.prevBest+'점':'첫 기록 등록!')+'</div>':'')+
      (perfect?'<div class="record">✨ 올 클리어</div>':'')+
      '<div class="res-grid">'+
        '<div class="res-cell"><b class="'+(g.correct===g.answered&&g.answered?'ok':'')+'">'+g.correct+'/'+g.answered+'</b><span>정답</span></div>'+
        '<div class="res-cell"><b>'+acc+'%</b><span>정답률</span></div>'+
        '<div class="res-cell"><b>'+g.maxCombo+'</b><span>최고 콤보</span></div>'+
      '</div>'+
      unlockHtml+
      '<div class="res-note">'+esc(note)+'</div>'+
      '<div class="res-actions">'+
        '<button class="btn-primary" data-act="again">다시 도전</button>'+
        '<button class="btn-ghost" data-act="go-home">홈으로</button>'+
      '</div>'+
      '<div style="height:20px"></div>'+
    '</div>';

  /* score count-up */
  const el=$('res-score');
  const target=g.score;
  const t0=performance.now();
  const dur=700;
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3);
    el.innerHTML=Math.round(target*e)+'<small>점</small>';
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setTimeout(function(){ el.innerHTML=target+'<small>점</small>'; },dur+120);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const tab=e.target.closest('[data-tab]');
  if(tab){
    sfx('tap');
    if(tab.dataset.tab==='home'){ renderHome(); showScreen('home'); }
    else if(tab.dataset.tab==='collection'){ renderCollection(); showScreen('collection'); }
    else { renderSettings(); showScreen('settings'); }
    return;
  }

  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;

  if(act==='start'){
    sfx('tap');
    start(el.dataset.mode,el.dataset.cat);
  }
  else if(act==='next'){ nextQuestion(); }
  else if(act==='again'){ start(LAST.mode,LAST.cat); }
  else if(act==='go-home'){ G=null; renderHome(); showScreen('home'); }
  else if(act==='toggle-sound'){
    DATA.sound=!DATA.sound; save(); renderSettings();
    if(DATA.sound) sfx('tap');
  }
  else if(act==='toggle-vibrate'){
    DATA.vibrate=!DATA.vibrate; save(); renderSettings(); buzz(20);
  }
  else if(act==='reset'){
    confirmModal({
      title:'모든 기록을 지울까요?',
      desc:'최고 점수, 오답 노트, 칭호가 모두 사라져요. 되돌릴 수 없습니다.',
      ok:'지우기', cancel:'취소', danger:true
    }).then(function(yes){
      if(!yes) return;
      DATA=JSON.parse(JSON.stringify(DEFAULT));
      save();
      G=null;
      renderHome(); renderSettings(); showScreen('settings');
      showToast('🗑️','기록을 지웠어요','처음부터 다시 시작해요.');
    });
  }
  else if(act==='equip'){
    DATA.title=el.dataset.title; save();
    renderTitles();
    showToast('🎖️','칭호를 착용했어요',DATA.title);
  }
});

$('seg').addEventListener('click',function(e){

  renderCollection();
});

$('btn-quit').addEventListener('click',function(){
  if(!G) return;
  confirmModal({
    title:'그만둘까요?',
    desc:'지금까지 푼 문제의 점수로 라운드가 끝나요. 오답은 노트에 남습니다.',
    ok:'그만두기', cancel:'계속하기'
  }).then(function(yes){
    if(yes) finish(false);
  });
});

$('btn-sound-home').addEventListener('click',function(){
  DATA.sound=!DATA.sound; save();
  this.textContent=DATA.sound?'🔊':'🔇';
  if(DATA.sound) sfx('tap');
  if(SCREEN==='settings') renderSettings();
});

document.addEventListener('keydown',function(e){
  if(SCREEN!=='quiz'||!G) return;
  if(G.locked){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); nextQuestion(); }
    return;
  }
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    const n=document.querySelectorAll('#q-choices button').length;
    if(n===2) answer(0);
    return;
  }
  const n=Number(e.key);
  const total=document.querySelectorAll('#q-choices button').length;
  if(n>=1&&n<=total){ e.preventDefault(); answer(n-1); }
});

/* ---------- boot ---------- */
function boot(){
  const sb=$('btn-sound-home');
  if(sb) sb.textContent=DATA.sound?'🔊':'🔇';
  renderHome();
  renderSettings();
  showScreen('home');
}
document.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading') boot();

window.__HB = { DATA:function(){return DATA;}, QUESTIONS:QUESTIONS, ACHS:ACHS };

})();

</script>
</body>
</html>
